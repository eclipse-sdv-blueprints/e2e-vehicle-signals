# Custom TOSCA relationship types for the E2E Vehicle Signals virtual setup.

tosca_definitions_version: tosca_simple_yaml_1_3

relationship_types:

  sdv.relationships.PublishesToMQTT:
    derived_from: tosca.relationships.ConnectsTo
    description: >
      The source component publishes MQTT messages to the target MQTT broker.
      Used by: VirtualIndicatorUI → MosquittoMQTTBroker
               GrpcMqttBridge subscribes from MosquittoMQTTBroker
    valid_target_types: [sdv.nodes.MosquittoMQTTBroker]

  sdv.relationships.SubscribesViaGRPC:
    derived_from: tosca.relationships.ConnectsTo
    description: >
      The source component connects to Kuksa Databroker over gRPC to read or
      write VSS signal values.
      Used by: GrpcMqttBridge, KuksaLiviBridge, VirtualIndicatorUI → KuksaDatabroker
    valid_target_types: [sdv.nodes.KuksaDatabroker]

  sdv.relationships.ForwardsToFleet:
    derived_from: tosca.relationships.ConnectsTo
    description: >
      VSS signal values are forwarded from Kuksa Databroker to the Fleet
      Management stack via the FMS Forwarder using Zenoh / uProtocol.
    valid_target_types: [sdv.nodes.FleetManagementStack]
