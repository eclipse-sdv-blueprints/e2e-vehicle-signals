# Static Grafana datasource provisioning for the FMS InfluxDB bucket.
#
# Uses the hardcoded InfluxDB admin token (DOCKER_INFLUXDB_INIT_ADMIN_TOKEN)
# so the file can be mounted at Grafana startup without waiting for the
# InfluxDB init-script to generate a token and write it to the shared volume.
#
# The UID must match the value hardcoded in FMS-Fleet.json (PDC312342D5DCA611).
apiVersion: 1
datasources:
  - name: "InfluxDB-SDV-Flux"
    uid: "PDC312342D5DCA611"
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: sdv
      defaultBucket: demo
      tlsSkipVerify: true
    secureJsonData:
      token: "fms-backend-admin-token"
    editable: true
