configs:
  mosquitto_conf:
    file: ./config/mosquitto.conf
  grpc_mqtt_config:
    file: ./config/grpc-mqtt.yaml
  grpc_livi_config:
    file: ./config/grpc-livi.yaml
  site_config:
    file: ./config/site-config.json
  vss_overlay_json:
    file: ../external/fleet-management/spec/overlay/vss.json
  influxdb_init_sh:
    file: ./config/create-fms-token.sh
  grafana_dashboards_yaml:
    file: ../external/fleet-management/grafana/provisioning/dashboards/dashboards_from_filesystem.yaml
  grafana_fms_dashboard:
    file: ../external/fleet-management/grafana/dashboards/FMS-Fleet.json
  zenoh_router_config:
    file: ../external/fleet-management/config/zenoh/config-router.json5
  zenoh_client_config:
    file: ../external/fleet-management/config/zenoh/config-client.json5

volumes:
  influxdb-data:
  influxdb-auth:
  grafana-datasources:
  fleet-analysis-tmp:

networks:
  fms-vehicle:
    driver: bridge
  fms-backend:
    driver: bridge

services:
  mosquitto:
    image: docker.io/eclipse-mosquitto:latest
    restart: unless-stopped
    networks:
      - fms-vehicle
    ports:
      - "1883:1883"
    configs:
      - source: mosquitto_conf
        target: /mosquitto/config/mosquitto.conf

  grpc-mqtt-bridge:
    image: ghcr.io/eclipse-sdv-blueprints/e2e-vehicle-signals/grpc-mqtt-bridge:main
    restart: unless-stopped
    networks:
      - fms-vehicle
    configs:
      - source: grpc_mqtt_config
        target: /config/grpc-mqtt.yaml
    command: ["--config", "/config/grpc-mqtt.yaml"]

  kuksa-livi-bridge:
    image: ghcr.io/eclipse-sdv-blueprints/e2e-vehicle-signals/kuksa-livi-bridge:main
    restart: on-failure
    networks:
      - fms-vehicle
    configs:
      - source: grpc_livi_config
        target: /config/grpc-livi.yaml
    command: ["--config", "/config/grpc-livi.yaml"]

  virtual-indicator-ui:
    image: virtual-indicator-ui:latest
    build:
      context: ./virtual-indicator-ui
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - fms-vehicle
    ports:
      - "8091:8091"
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      KUKSA_HOST: databroker
      KUKSA_PORT: "55556"
      MQTT_TOPIC: InVehicleTopics

  databroker:
    image: quay.io/eclipse-kuksa/kuksa-databroker:0.6.0
    restart: unless-stopped
    networks:
      - fms-vehicle
    ports:
      - "55556:55556"
    configs:
      - source: vss_overlay_json
        target: /vss_overlay.json
    environment:
      KUKSA_DATABROKER_ADDR: "0.0.0.0"
      KUKSA_DATABROKER_PORT: "55556"
      KUKSA_DATABROKER_METADATA_FILE: /vss_overlay.json
      RUST_LOG: "info"
    command: ["--insecure"]

  csv-provider:
    image: quay.io/eclipse-kuksa/csv-provider:0.4.5
    restart: unless-stopped
    networks:
      - fms-vehicle
    depends_on:
      databroker:
        condition: service_started
    environment:
      PROVIDER_INFINITE: "1"
      PROVIDER_LOG_LEVEL: "INFO"
      KUKSA_DATA_BROKER_ADDR: databroker
      KUKSA_DATA_BROKER_PORT: "55556"
    volumes:
      - type: bind
        source: ../external/fleet-management/csv-provider/signalsFmsRecording.csv
        target: /dist/signals.csv
        read_only: true

  fms-zenoh-router:
    image: eclipse/zenoh:1.1.0
    restart: unless-stopped
    networks:
      - fms-vehicle
      - fms-backend
    ports:
      - "7447:7447"
    configs:
      - source: zenoh_router_config
        target: /zenoh-config.json5
    command: ["-c", "/zenoh-config.json5"]
    environment:
      RUST_LOG: zenoh=info

  fms-forwarder:
    image: ghcr.io/eclipse-sdv-blueprints/fleet-management/fms-forwarder:main
    restart: unless-stopped
    networks:
      - fms-vehicle
      - fms-backend
    depends_on:
      csv-provider:
        condition: service_started
      fms-zenoh-router:
        condition: service_started
    environment:
      KUKSA_DATABROKER_URI: "http://databroker:55556"
      TIMER_INTERVAL: "500ms"
      RUST_LOG: "info,fms_forwarder=info"
      TRUST_STORE_PATH: /etc/ssl/certs/ca-certificates.crt
    configs:
      - source: zenoh_client_config
        target: /zenoh-config.json5
    command: ["zenoh", "-c", "/zenoh-config.json5"]

  pi5-demo-website:
    image: pi5-demo-website:virtual
    build:
      context: ../devices/raspberry-pi5/website
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - fms-vehicle
      - fms-backend
    ports:
      - "8090:8090"
    configs:
      - source: site_config
        target: /app/site-config.json
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  influxdb:
    image: docker.io/library/influxdb:2.7
    restart: unless-stopped
    networks:
      - fms-backend
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD-SHELL", "influx ping"]
      interval: 5s
      timeout: 3s
      start_period: 5s
    command: influxd
    env_file: ../external/fleet-management/influxdb/fms-demo.env
    environment:
      DOCKER_INFLUXDB_INIT_MODE: "setup"
      DOCKER_INFLUXDB_INIT_USERNAME: "fms-demo"
      DOCKER_INFLUXDB_INIT_PASSWORD: "fms-demo-secret"
      DOCKER_INFLUXDB_INIT_RETENTION: "1w"
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "fms-backend-admin-token"
      DOCKER_INFLUXDB_INIT_CLI_CONFIG_NAME: "fms-init"
      INFLUX_CONFIGS_PATH: "/tmp/influx-configs"
    configs:
      - source: influxdb_init_sh
        target: /docker-entrypoint-initdb.d/influxdb_init.sh
        mode: 0755
    tmpfs:
      - /tmp
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-auth:/tmp/out
      - grafana-datasources:/tmp/influxdb-datasources

  grafana:
    image: docker.io/grafana/grafana:9.5.14
    restart: unless-stopped
    networks:
      - fms-backend
    ports:
      - "3000:3000"
    depends_on:
      influxdb:
        condition: service_healthy
    configs:
      - source: grafana_dashboards_yaml
        target: /etc/grafana/provisioning/dashboards/grafana_dashboards_from_fs.yaml
      - source: grafana_fms_dashboard
        target: /etc/dashboards/grafana_fms_dashboard.json
        mode: 0644
    volumes:
      - grafana-datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      GF_SECURITY_ADMIN_USER: sdv
      GF_SECURITY_ADMIN_PASSWORD: sdv
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 500ms

  fms-server:
    image: ghcr.io/eclipse-sdv-blueprints/fleet-management/fms-server:main
    restart: unless-stopped
    networks:
      - fms-backend
    ports:
      - "8081:8081"
    depends_on:
      influxdb:
        condition: service_healthy
    env_file: ../external/fleet-management/influxdb/fms-demo.env
    environment:
      INFLUXDB_TOKEN_FILE: /tmp/fms-demo.token
      RUST_LOG: info
    volumes:
      - influxdb-auth:/tmp:ro

  fms-consumer:
    image: ghcr.io/eclipse-sdv-blueprints/fleet-management/fms-consumer:main
    restart: unless-stopped
    networks:
      - fms-backend
    depends_on:
      influxdb:
        condition: service_healthy
      fms-zenoh-router:
        condition: service_started
    env_file: ../external/fleet-management/influxdb/fms-demo.env
    environment:
      INFLUXDB_TOKEN_FILE: /tmp/fms-demo.token
      RUST_LOG: "info,fms_consumer=debug,influx_client=debug"
    configs:
      - source: zenoh_client_config
        target: /zenoh-config.json5
    command: ["zenoh", "-c", "/zenoh-config.json5"]
    volumes:
      - influxdb-auth:/tmp:ro

  fleet-analysis-backend:
    image: fleet-analysis-backend:virtual
    build:
      context: ../external/fleet-management/components/backend-fleet-analysis-java
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - fms-backend
    ports:
      - "8082:8080"
    depends_on:
      influxdb:
        condition: service_healthy
    env_file: ../external/fleet-management/influxdb/fms-demo.env
    environment:
      INFLUXDB_TOKEN_FILE: /run/influxdb-auth/fms-demo.token
      INFLUXDB_STATS_INTERVAL_SECONDS: "30"
    volumes:
      - influxdb-auth:/run/influxdb-auth:ro
      - fleet-analysis-tmp:/tmp
